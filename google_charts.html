			function cleanAllCircles(){
				let containers = ['current_ratio_chart', 'dsi_chart', 'dso_chart', 'dpo_chart'];
				containers.forEach( container => {
					let element = document.getElementById(container);
					let allCircles = element.querySelectorAll("circle");
					console.log(allCircles);
					Array.prototype.forEach.call(allCircles, function(circle, i) {
						if(i == allCircles.length -1){
							circle.remove();
						} else {
							circle.setAttribute('fill', '#fff');
							circle.setAttribute('stroke', '#fff');
						}
					});
					let findPath = element.querySelector("path[stroke='#c63310']");
					if(findPath != null){
						findPath.setAttribute('fill', '#5B6472');
						findPath.setAttribute('stroke', '#5B6472');
					}
					let findTickPath = element.querySelector("path[stroke='#333333']");
					if(findTickPath != null){
						findTickPath.remove();
					}
					let text = element.querySelector("text[text-anchor='middle']");
					if(text != null){
						text.remove();
					}
				});				
			}

			function createDashboardRegionalMonthly(){
				let regionChartMonthlyData = new google.visualization.DataTable();
						regionChartMonthlyData.addColumn('string', 'Month');
						let stateList = [];
						if(chartData.transaction_regions_monthly.length > 0){
