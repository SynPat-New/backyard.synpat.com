        #container {

            margin: 0;
            width: 100%;
            position: relative;
            font-family: 'Roboto', sans-serif;
        }

            #container svg {
                border: 1px solid #ccc;
            }

            #container .header {
                text-anchor: middle;
            }

            #container .hline {
                stroke: #aaa;
                stroke-width: 1;
                stroke-dasharray: 5, 5;
            }

            #container .box {
                fill: #fff;
                fill-opacity: 0.8;
                stroke: #999;
                stroke-width: 2;
            }

            #container .tline {
                stroke: #aaa;
                stroke-width: 1;
                stroke-dasharray: 5, 5;
            }

            #container .thead {
                text-anchor: end;
                font-size: 11px;
            }

            #container .thead2 {
                text-anchor: start;
                font-size: 11px;
            }

            #container .btext {
                font-size: 14px;
                fill: #000;
                font-weight: bold;
            }

            #container .btext2 {
                font-size: 12px;
                fill: #555;
            }

            #container .btext2 .active {
                fill: #f00;
            }

            #container .connection {
                fill: none;
                stroke: #aaa;
                stroke-width: 2;
            }

                #container .connection.active {
                    stroke-width: 5;
                }

            #container .tooltip {
                position: absolute;
                padding: 5px 10px;
                border-radius: 4px;
                pointer-events: none;
                background: #555;
                color: #fff;
                font-size: 12px;
            }

        .popup {
            position: fixed;
            top: 0;
            right: 0;
            bottom: auto;
            left: auto;
            max-height: 90%;
            overflow-y: scroll;
            background: #fff;
            z-index: 999;
            font-size: 12px;
        }

            .popup > div {
                width: 600px;
                padding: 10px;
                border: 1px solid #aaa;
                margin: 10px;
                position: relative;
            }

            .popup > div > a {
                position: absolute;
                right: 10px;
                top: 10px;
            }

            .popup > div > label {
                font-weight: bold;
                text-transform: uppercase;
                margin-bottom: 5px;
                display: block;
                padding-right: 50px;
            }

            .popup > div > table {
                border-spacing: 0;
                border-collapse: collapse;
                width: 100%;
            }

            .popup table.top {
                margin-bottom: 20px;
            }

                .popup table.top td {
                    width: 50%;
                    padding-top: 10px;
                }

            .popup table.bottom th, .popup table.bottom td {
                text-align: left;
                width: 25%;
                padding: 2px 5px;
            }

            .popup table.bottom .title {
                padding-top: 5px;
            }

                .popup table.bottom .title td {
                    background: #ddd;
                }

        .ui-slider-horizontal {
            height: 0.7em;
        }

        .buttons {
            position: absolute;
            top: 38px;
            left: 12px;
            width: 65px;
        }

        .buttons > button {
            width: 28px;
            height: 22px;
            margin-right: 2px;
            margin-bottom: 2px;
        }
    </style>
