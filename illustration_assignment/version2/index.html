                text-anchor: middle;
            }*/

            #container .hline {

                stroke-width: 1;

            }

                fill: #fff;
                fill-opacity: 0.8;
                stroke: #999;
                stroke-width: 2;
            }

                #container .box.box-inventor {
                    fill: #eee;
                }

            #container .tline {
                stroke: #aaa;
                stroke-width: 1;
                stroke-dasharray: 5, 5;
            }

            #container .thead {
                text-anchor: end;
                font-size: 11px;
            }

            #container .thead2 {
                text-anchor: start;
                font-size: 11px;
            }

            #container .btext {
                font-size: 14px;
                fill: #000;
                font-weight: bold;
            }

            #container .box-3.btext {
                font-size: 13px;
            }

            #container .btext2 {
                font-size: 12px;
                fill: #555;
            }

                #container .btext2 .active {
                    fill: #f00;
                }

            #container .connection {
                fill: none;
                stroke: #aaa;
                stroke-width: 2;
            }

                #container .connection.active {
                    stroke-width: 5;
                }

            #container .tooltip {
                position: absolute;
                padding: 5px 10px;
                border-radius: 4px;
                pointer-events: none;
                background: #555;
                color: #fff;
                font-size: 12px;
            }

        .popup {
            position: fixed;
            top: 0;
            right: 0;
            bottom: auto;
            left: auto;
            max-height: 90%;
            overflow-y: scroll;
            background: #fff;
            z-index: 999;
            font-size: 12px;
        }

            .popup > div {
                width: 600px;
                padding: 10px;
                border: 1px solid #aaa;
                margin: 10px;
                position: relative;
            }

                .popup > div > a.close {
                    position: absolute;
                    right: 10px;
                    top: 10px;
                }

                .popup > div > a.comment {
                    position: absolute;
                    right: 10px;
                    top: 30px;
                }

                .popup > div > label {
                    font-weight: bold;
                    text-transform: uppercase;
                    margin-bottom: 5px;
                    display: block;
                    padding-right: 50px;
                }

                    .popup > div > label.prop {
                        cursor: pointer;
                        color: #0057E7;
                    }

                .popup > div > table {
                    border-spacing: 0;
                    border-collapse: collapse;
                    width: 100%;
                }

            .popup table.top {
                margin-bottom: 20px;
            }

                .popup table.top td {
                    width: 50%;
                    padding-top: 10px;
                    vertical-align: top;
                }

            .popup table.bottom th, .popup table.bottom td {
                text-align: left;
                width: 25%;
                padding: 2px 5px;
            }

            .popup table.bottom .title {
                padding-top: 5px;
            }

                .popup table.bottom .title td {
                    background: #ddd;
                }

        .ui-slider-horizontal {
            height: 0.7em;
        }

        .buttons {
            position: fixed;
            top: 21px;
            left: 93px;
            width: 130px;
            z-index: 10;
        }

            .buttons > button {
                width: 28px;
                height: 22px;
                margin-right: 2px;
                margin-bottom: 2px;
            }

        .menu {
            position: absolute;
            top: 1px;
            left: 1px;
            height: 45px;
            background: rgba(255, 255, 255, 0.8);
        }

        .popup-comment {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .popup-comment > div {
            width: 400px;
            height: 200px;
            margin: 50px auto 0;
            background: #fff;
            padding: 10px;
        }

        .popup-comment textarea {
            resize: none;
            width: 100%;
            height: 175px;
            padding: 0;
        }

        .popup-comment a {
            font-size: 13px;
            float: right;
            margin-left: 10px;
        }
    </style>
